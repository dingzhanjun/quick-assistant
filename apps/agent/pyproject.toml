[project]
name = "order-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents[deepgram,openai,silero,turn-detector,xai]>=1.8.8",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_agent"]

[dependency-groups]
dev = ["pytest>=8"]
